plugins { id 'com.android.application' }
android {
    namespace 'com.simuesp.studio'
    compileSdk 36
    defaultConfig {
        applicationId "com.simuesp.studio"
        minSdk 24
        targetSdk 36
        versionCode 32
        versionName "3.6"
    }
    signingConfigs {
        release {
            // Firma release solo si se definen estas variables (ver LEEME.txt)
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
