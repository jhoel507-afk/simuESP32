name: Build Windows
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copiar la app (misma que el APK)
        shell: bash
        run: cp app/src/main/assets/index.html windows/index.html
      - name: Instalar dependencias
        working-directory: windows
        run: npm install
      - name: Generar instalador y portable
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SimuESP-windows
          path: |
            windows/dist/*.exe
